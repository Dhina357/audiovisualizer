<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Fire Trace Visualizer</title>
    <style>
        body {
            margin: 0;
            background-color: #020204;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        button {
            padding: 18px 36px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff3300, #ffaa00);
            border: none;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 60, 0, 0.4);
            z-index: 10;
            transition: all 0.3s ease;
        }
        button:hover { transform: scale(1.05); }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }
    </style>
</head>
<body>

    <button id="startBtn">🔥 Ignite Spark Visualizer</button>
    <canvas id="visualizerCanvas"></canvas>

    <script src="visualizer-engine.js"></script>
</body>
</html>
